<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Offline · Ikigai</title>
    <style>
      :root {
        --background: #f3f4f6;
        --foreground: #12141a;
        --muted: #5c6370;
        --accent: #0d5c63;
        --border: #d8dce3;
        --surface: #ffffff;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--background);
        color: var(--foreground);
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.45;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-top: 1.25rem;
      }
      a {
        min-height: 44px;
        min-width: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--foreground);
        text-decoration: none;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        This screen is saved on your phone. Open a page once while online and it
        will be available here without a network.
      </p>
      <nav>
        <a href="/">Overview</a>
        <a href="/map">Map</a>
        <a href="/notes">Notes</a>
        <a href="/daily">Daily</a>
        <a href="/growth">Growth</a>
        <a href="/skills">Skills</a>
      </nav>
    </main>
  </body>
</html>
